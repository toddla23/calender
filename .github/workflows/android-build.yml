name: Android 앱 빌드

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # 릴리스에 파일 첨부

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 버전 계산 (태그 v1.2.3 → versionCode 10203)
        run: |
          REF="${GITHUB_REF_NAME#v}"
          if [[ "$REF" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ANDROID_VERSION_NAME=$REF" >> $GITHUB_ENV
            echo "ANDROID_VERSION_CODE=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]} ))" >> $GITHUB_ENV
          fi

      - name: 서명 키 준비 (GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 시크릿이 없습니다. README 의 'Android 앱' 절을 보세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV

      - name: APK·AAB 빌드
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p ../dist-android
          cp app/build/outputs/apk/release/app-release.apk ../dist-android/BatangCalendar.apk
          cp app/build/outputs/bundle/release/app-release.aab ../dist-android/BatangCalendar.aab
          ls -la ../dist-android

      - name: 서명 확인
        run: |
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs dist-android/BatangCalendar.apk | grep SHA-256

      - uses: actions/upload-artifact@v4
        with:
          name: batang-calendar-android
          path: dist-android/*

      - name: GitHub 릴리스에 첨부 (v* 태그일 때)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-android/*
