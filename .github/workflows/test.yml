name: 테스트

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: rootpw-test
          MARIADB_DATABASE: deskcal_test
          MARIADB_USER: deskcal
          MARIADB_PASSWORD: testpw
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 서버 테스트 (인증·동기화·충돌)
        run: npm test -w server
      - name: 동기화 시나리오 테스트
        run: npm test -w web
      - name: 빌드
        run: npm run build -w web && npm run build -w server
      - name: Docker 이미지 빌드 (arm64 포함)
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform linux/arm64 -t deskcal:ci .
