name: Windows 설치 파일 빌드

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 의존성 설치
        run: npm ci

      - name: 테스트 (서버 제외, 동기화 엔진 단위 테스트)
        run: npx vitest run test/engine.test.ts
        working-directory: web

      - name: 웹 UI 빌드
        run: npm run build -w web

      - name: Tauri 빌드 (NSIS 설치 파일)
        run: npm run tauri -w desktop -- build

      - name: 설치 파일 크기
        shell: pwsh
        run: Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: batang-calendar-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
