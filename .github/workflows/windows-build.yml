name: Windows 설치 파일 빌드

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # 릴리스 생성·파일 첨부

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 의존성 설치
        run: npm ci

      - name: 테스트 (서버 제외, 동기화 엔진 단위 테스트)
        run: npx vitest run test/engine.test.ts
        working-directory: web

      - name: 웹 UI 빌드
        run: npm run build -w web

      - name: Tauri 빌드 (NSIS 설치 파일)
        run: npm run tauri -w desktop -- build

      - name: 설치 파일 크기
        shell: pwsh
        run: Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      # 항상 같은 이름의 사본도 만들어 releases/latest/download/BatangCalendar-setup.exe 링크가 늘 최신을 가리키게 한다
      - name: 고정 이름 사본
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $exe = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist-release/
          Copy-Item $exe.FullName dist-release/BatangCalendar-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: batang-calendar-windows
          path: dist-release/*.exe

      - name: GitHub 릴리스에 첨부 (v* 태그일 때)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 바탕 달력 ${{ github.ref_name }}
          files: dist-release/*.exe
          generate_release_notes: true
          body: |
            ## 설치
            아래 **BatangCalendar-setup.exe** 를 받아 실행하세요. 관리자 권한 없이 현재 사용자용으로 설치됩니다.
            처음 실행하면 Google 계정으로 로그인합니다. 서버 주소는 설정 → 윈도우 앱에서 바꿀 수 있습니다.

            코드 서명이 없어 처음 실행할 때 SmartScreen 경고가 뜰 수 있습니다: **추가 정보 → 실행**.
