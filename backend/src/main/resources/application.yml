server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: calendar-backend
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/calendar_db}
    username: ${DB_USERNAME:calendar}
    password: ${DB_PASSWORD:calendar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

calendar:
  jwt:
    # 32바이트 이상 필수. 운영에서는 반드시 JWT_SECRET 환경변수로 주입
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:60}
  google:
    # 쉼표로 구분: 웹/Electron/Android/iOS 클라이언트 ID
    client-ids: ${GOOGLE_CLIENT_IDS:}
  auth:
    # 로컬 개발 전용. Google 없이 이메일만으로 로그인 (운영에서는 false 유지)
    dev-login-enabled: ${DEV_LOGIN_ENABLED:false}
  holidays:
    service-key: ${HOLIDAY_API_KEY:}
