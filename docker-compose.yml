services:
  deskcal:
    build: .
    image: deskcal:latest
    container_name: deskcal
    # 호스트의 MariaDB(127.0.0.1:3306)에 붙고, 127.0.0.1:3000 으로만 열기 위해 host 네트워크 사용
    network_mode: host
    env_file: .env
    environment:
      HOST: 127.0.0.1
      PORT: "3000"
      BACKUP_DIR: /backups
      TZ: ${TZ:-Asia/Seoul}
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./backups:/backups
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
